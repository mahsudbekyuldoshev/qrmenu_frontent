<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" /> <!-- Gold -->
      <stop offset="50%" style="stop-color:#E0E0E0;stop-opacity:1" /> <!-- Silver -->
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" /> <!-- Gold -->
    </linearGradient>
  </defs>
  
  <!-- RF Monogram: R and F intertwined -->
  <!-- R part -->
  <path d="M50 40 L50 160 M50 40 L110 40 C130 40 130 80 110 80 L50 80 M110 80 L140 160" 
        stroke="url(#metalGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- F part -->
  <path d="M160 40 L160 160 M160 40 L220 40 M160 90 L200 90" 
        stroke="url(#metalGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        
  <!-- "RestoFlow" matni -->
  <text x="260" y="110" font-family="sans-serif" font-weight="bold" font-size="70" fill="white">RestoFlow</text>
  
  <!-- "RESTAURANT SAAS" matni -->
  <text x="260" y="150" font-family="sans-serif" font-weight="normal" font-size="25" fill="white" letter-spacing="4">RESTAURANT SAAS</text>
</svg>
